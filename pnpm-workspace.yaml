strictDepBuilds: true
engineStrict: true

# one day
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@scaleway/*'
  # Renovate security update: svgo@4.0.2
  - svgo@4.0.2
  # Renovate security update: next@16.2.11
  - next@16.2.11
  # Renovate security update: postcss@8.5.18
  - postcss@8.5.18

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msgpackr-extract: false
  sharp: false

trustPolicy: off

blockExoticSubdeps: true

autoInstallPeers: true
savePrefix: ''
strictPeerDependencies: false

packages:
  - 'packages/*'
  - 'utils/*'
  - 'examples/*'
  - 'e2e'

pmOnFail: error
# Needed as we run a pnpm install after building packages
optimisticRepeatInstall: false

overrides:
  vite: "catalog:"
  vitest: "catalog:"

catalog:
  vite: 8.2.0
  vitest: 4.1.10
  typescript: 7.0.2

peerDependencyRules:
  allowedVersions:
    '@types/react': 18 || 19

supportedArchitectures:
  cpu: [ arm64, current ]
  os: [ darwin, current ]
