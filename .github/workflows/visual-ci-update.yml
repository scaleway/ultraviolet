name: Visual CI Update

# Update the committed screenshot references of a pull request on demand: add
# the `visual-ci-update` label to the PR. The job re-renders every reference on
# linux/chromium (CI is the single renderer, see visualProjectConfig.ts), pushes
# them back as a `chore(visual)` commit, then removes the label so it can be
# added again.
#
# Triggering by label because GitHub only runs `workflow_dispatch` and
# `issue_comment` workflows that exist on the default branch: while this file
# lives only on a PR branch, the `labeled` pull_request event is the only
# manual entry point. Caveat: the bot push makes the next CI run on the PR
# require a maintainer approval (GitHub rule for GITHUB_TOKEN updates).

on:
  pull_request:
    types: [labeled]

concurrency:
  group: visual-ci-update-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_CACHE: remote:r

jobs:
  visual-ci-update:
    if: github.event.label.name == 'visual-ci-update' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Head branch, not the merge ref: the commit below lands on the PR.
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - uses: ./.github/actions/setup-playwright
        with:
          install-args: chromium
      # --update overrides vitest's "CI never writes references" guard: vitest
      # resolves updateSnapshot to "all" when the flag is explicit.
      - run: pnpm turbo run test:visual -- --update
      - name: Commit and push updated references
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)packages/**/__screenshots__/**'
          if git diff --staged --quiet; then
            echo "No screenshot reference changed."
          else
            git diff --staged --stat
            git commit -m "chore(visual): update screenshot references"
            git pull --rebase origin "$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          fi
      - name: Remove label to re-arm
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label visual-ci-update || echo "label already removed"
