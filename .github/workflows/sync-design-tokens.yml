name: Design tokens

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch of the design-tokens repository to fetch tokens from'
        required: true
        default: 'main'
        type: string

jobs:
  synchronise:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          LANG: en_US.UTF-8
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Generate json files
        run: |
          pnpm run tokens:update
        env:
          TOKENS_BRANCH: ${{ inputs.branch }}

      - name: Compare & Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: main
          author: Scaleway Design <github@scaleway.com>
          commit-message: 'chore(theme): synchronise design tokens'
          branch: chore/design-tokens-synchronise
          delete-branch: true
          title: 'chore(theme): synchronise design tokens'
          body: |
            ### Summary

            Synchronise design tokens from the [design-tokens](https://github.com/scaleway/design-tokens) repository.
